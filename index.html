<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Blends</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">

	<!-- Optional: without a network connection the system font stack is used instead. -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">

	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="app">
		<main class="stage" id="stage">
			<div class="preview-frame" id="preview-frame"></div>
			<div class="caption">
				<span id="output-description"></span>
				<span class="shortcuts"><kbd>N</kbd> new wallpaper &nbsp; <kbd>L</kbd> new layout</span>
			</div>
		</main>

		<aside class="panel">
			<div class="panel-header">
				<h1>Blends</h1>
				<p>Soft color fields to sit quietly behind your windows.</p>
				<button class="button" id="new-wallpaper-button" type="button">New wallpaper</button>
			</div>

			<section aria-labelledby="colors-heading">
				<h2 id="colors-heading">Colors</h2>
				<label class="field">
					<span>Mood</span>
					<select id="mood-select"></select>
				</label>
				<div class="swatches" id="swatches" role="group" aria-label="Palette"></div>

				<div class="color-editor" id="color-editor" hidden>
					<label class="field">
						<span>Lightness <span class="value" id="lightness-value"></span></span>
						<input type="range" class="gradient" id="lightness-slider" min="0" max="1" step="0.005">
					</label>
					<label class="field">
						<span>Chroma <span class="value" id="chroma-value"></span></span>
						<input type="range" class="gradient" id="chroma-slider" min="0" max="0.32" step="0.002">
					</label>
					<label class="field">
						<span>Hue <span class="value" id="hue-value"></span></span>
						<input type="range" class="gradient" id="hue-slider" min="0" max="360" step="1">
					</label>
					<p class="hint" id="gamut-note"></p>
					<div class="row">
						<button class="button" id="remove-color-button" type="button">Remove color</button>
						<button class="button" id="close-editor-button" type="button">Done</button>
					</div>
				</div>

				<div class="row">
					<button class="button" id="new-colors-button" type="button">New colors</button>
				</div>
			</section>

			<section aria-labelledby="shape-heading">
				<h2 id="shape-heading">Shape</h2>
				<label class="field">
					<span>Softness <output id="softness-value"></output></span>
					<input type="range" id="softness-slider" min="0.45" max="2.2" step="0.01">
				</label>
				<label class="field">
					<span>Warp <output id="warp-value"></output></span>
					<input type="range" id="warp-slider" min="0" max="1" step="0.01">
				</label>
				<label class="field">
					<span>Shading <output id="shading-value"></output></span>
					<input type="range" id="shading-slider" min="0" max="1" step="0.01">
				</label>
				<label class="field">
					<span>Vignette <output id="vignette-strength-value"></output></span>
					<input type="range" id="vignette-strength-slider" min="0" max="1" step="0.001">
				</label>
				<div class="field">
					<span>Vignette type</span>
					<div class="segmented three" role="group" aria-label="Vignette type">
						<button type="button" id="vignette-falloff-linear" aria-pressed="false">Linear</button>
						<button type="button" id="vignette-falloff-smooth" aria-pressed="false">Smoothstep</button>
						<button type="button" id="vignette-falloff-smoother" aria-pressed="false">Smootherstep</button>
					</div>
				</div>
				<div class="row">
					<button class="button" id="new-layout-button" type="button">New layout</button>
				</div>
			</section>

			<section aria-labelledby="finish-heading">
				<h2 id="finish-heading">Finish</h2>
				<label class="field">
					<span>Grain <output id="grain-value"></output></span>
					<input type="range" id="grain-slider" min="0" max="1" step="0.01">
				</label>
				<p class="hint">Fine dither is always on, so gradients stay free of banding even with grain at zero.</p>
			</section>

			<section aria-labelledby="output-heading">
				<h2 id="output-heading">Output</h2>
				<label class="field">
					<span>Size</span>
					<select id="size-select"></select>
				</label>
				<div class="custom-size" id="custom-size" hidden>
					<input type="number" id="custom-width" min="64" max="8192" aria-label="Width in pixels">
					<span>×</span>
					<input type="number" id="custom-height" min="64" max="8192" aria-label="Height in pixels">
				</div>

				<div class="segmented" role="group" aria-label="Color space">
					<button type="button" id="color-space-srgb" aria-pressed="true">sRGB</button>
					<button type="button" id="color-space-p3" aria-pressed="false">Display P3</button>
				</div>
				<p class="hint" id="color-space-hint"></p>

				<div class="segmented three" role="group" aria-label="File format">
					<button type="button" id="format-png" aria-pressed="true">PNG</button>
					<button type="button" id="format-jpeg" aria-pressed="false">JPEG</button>
					<button type="button" id="format-webp" aria-pressed="false">WebP</button>
				</div>
				<label class="field" id="quality-field">
					<span>Quality <output id="quality-value"></output></span>
					<input type="range" id="quality-slider" min="0.6" max="1" step="0.01">
				</label>
				<p class="hint" id="format-hint"></p>
			</section>

			<div class="save">
				<button class="button primary" id="save-button" type="button">Save PNG</button>
				<div class="save-progress" id="save-progress" hidden><span id="save-progress-bar"></span></div>
				<p class="save-status" id="save-status" role="status"></p>
			</div>
		</aside>
	</div>

	<!-- Plain scripts rather than modules, so the page also works when opened from disk. Order matters. -->
	<script src="js/color.js"></script>
	<script src="js/palettes.js"></script>
	<script src="js/renderer.js"></script>
	<script src="js/color-profile.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
